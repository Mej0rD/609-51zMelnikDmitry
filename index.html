<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style/main.css">
    <script src="scripts/menu.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="brand" href="#" >
                <img src="images/logo-Icon.svg" alt="">
                <img src="images/Nexcent-logo.svg" alt="Nexcent">
            </a>
            <button class="header__toggle" type="button" aria-label="Открыть меню" aria-expanded="false"><img src="images/menu.svg" alt=""></button>
            <nav class="header__nav">
                <a href="#">Home</a>
                <a href="#">Service</a>
                <a href="#">Feature</a>
                <a href="#">Product</a>
                <a href="#">Testimonial</a>
                <a href="#">FAQ</a>
            </nav>
            <div class="header__actions">
                <a class="header__link header__link--login" href="#">Login</a>
                <a class="header__link header__link--signup" href="#">Sign up</a>
            </div>
        </div>
    </header>
    <main>
          <section class="hero">
            <div class="container hero__inner">
                <div class="hero__content">
                    <h1 class="hero__title">
                        Lessons and insights <span class="hero__accent"> from 8 years</span>
                    </h1>
                    <p class="hero__description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Elementum nisi aliquet volutpat pellentesque volutpat est.</p>
                    <a href="#" class="hero__link">Register</a>
                </div>
                <img class="hero__image" src="images/hero-illustration.svg" alt="">
            </div>
          </section>  
    </main>




</body>
</html>
